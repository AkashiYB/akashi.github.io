<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>打地狗 | 大大鲨是狼之争</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* 蓝粉梦幻背景 */
            background: linear-gradient(145deg, #ffffff 0%, #b95c8f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Poppins', cursive;
            margin: 0;
            padding: 20px;
        }

        /* 游戏主面板 - 蓝粉渐变 + 星光 */
        .game-container {
            background: #ffecf7;
            background-image: radial-gradient(circle at 10% 30%, rgba(180, 140, 255, 0.2) 2%, transparent 2.5%),
                              radial-gradient(circle at 85% 70%, rgba(255, 140, 200, 0.25) 1.8%, transparent 2%);
            background-size: 35px 35px, 40px 40px;
            border-radius: 80px 80px 60px 60px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.3), inset 0 1px 4px rgba(255,220,240,0.9);
            padding: 25px 30px 35px;
            transition: all 0.2s ease;
        }

        /* 计分板 - 粉蓝主题 */
        .stats {
            display: flex;
            justify-content: space-between;
            background: #3a2c68;
            background: linear-gradient(120deg, #4a3b7c, #2a1e54);
            padding: 12px 28px;
            border-radius: 100px;
            margin-bottom: 30px;
            color: #ffe0f5;
            text-shadow: 2px 2px 0 #2a1a4a;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.3), 0 6px 0 #1f1540;
        }
        .score-box, .timer-box, .target-box {
            background: #281f50;
            padding: 5px 20px;
            border-radius: 2rem;
            font-weight: bold;
            text-align: center;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 0 4px #9988dd, 0 2px 5px rgba(0,0,0,0.2);
        }
        .score-box span, .timer-box span, .target-box span {
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: block;
            color: #ffcaf0;
        }
        .score-box .value, .timer-box .value, .target-box .value {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
            color: #fff2fc;
            text-shadow: 0 2px 0 #5a3e9e;
        }
        .target-box .value {
            font-size: 1.8rem;
        }

        /* 网格 (洞穴) 蓝粉暗色调 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 22px;
            justify-items: center;
            align-items: center;
            margin-bottom: 30px;
            padding: 10px;
        }

        /* 洞穴样式 - 粉紫神秘感 */
        .hole {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 110px;
            background: radial-gradient(circle at 30% 25%, #735e9e, #2c1f52);
            border-radius: 50%;
            box-shadow: inset 0 10px 8px rgba(0,0,0,0.5), 0 8px 5px rgba(0,0,0,0.3), 0 0 0 6px #c58fbf;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s linear;
            position: relative;
        }
        .hole:active {
            transform: scale(0.96);
        }

        /* 地鼠 (小狗图标) 正常态 */
        .mole {
            background: radial-gradient(circle at 35% 30%, #ffb3e6, #e86fae);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: bold;
            box-shadow: 0 6px 0 #a13e72, inset 0 2px 10px rgba(255,225,250,0.9);
            transition: 0.05s linear;
            animation: popUp 0.12s cubic-bezier(0.34, 1.2, 0.8, 1);
            cursor: pointer;
        }
        
        /* 打击特效：放大+闪白+轻微旋转，快速消失 */
        .mole-hit {
            animation: hitEffect 0.18s cubic-bezier(0.2, 1.3, 0.6, 1) forwards !important;
        }
        
        @keyframes hitEffect {
            0% {
                transform: scale(1);
                filter: brightness(1);
                background: radial-gradient(circle at 35% 30%, #ffb3e6, #e86fae);
            }
            40% {
                transform: scale(1.28);
                filter: brightness(1.5);
                background: radial-gradient(circle at 35% 30%, #fff0c0, #ff99cc);
                box-shadow: 0 0 12px #ffddff;
            }
            100% {
                transform: scale(0.9);
                filter: brightness(0.9);
                opacity: 0;
            }
        }
        
        /* 空穴显示洞内暗紫色 */
        .empty-hole {
            width: 80%;
            height: 80%;
            background: #382b5a;
            border-radius: 50%;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            opacity: 0.85;
            color: #ad88c2;
        }

        @keyframes popUp {
            0% {
                transform: scale(0.2) translateY(30px);
                opacity: 0;
            }
            80% {
                transform: scale(1.1) translateY(-3px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* 按钮 - 粉嫩风格 */
        .btn-restart {
            background: #ff9acb;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 40px;
            width: 80%;
            margin: 0 auto;
            display: block;
            color: #341f42;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 7px 0 #b45f8a;
            transition: 0.07s linear;
            letter-spacing: 2px;
        }
        .btn-restart:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #b45f8a;
        }
        .btn-restart:hover {
            background: #ffb3dc;
        }

        .message-area {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #fae2ff;
            text-shadow: 1px 1px 0 #643e86;
            font-size: 0.9rem;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 18px;
            color: #ffe0f0;
        }

        /* ---------- 自定义居中弹窗 (模态框) ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        .modal-card {
            background: linear-gradient(145deg, #fff0fb, #ffe6f7);
            border-radius: 48px;
            width: 280px;
            max-width: 80%;
            padding: 24px 20px 32px;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,200,0.8);
            border: 2px solid #ffb3e0;
            animation: slideUp 0.25s cubic-bezier(0.21, 1.11, 0.35, 1);
        }
        .modal-icon {
            font-size: 4rem;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 8px 0 12px;
            color: #ac4e7c;
            text-shadow: 1px 1px 0 #ffccee;
        }
        .modal-message {
            font-size: 1.2rem;
            background: #fff0f5;
            padding: 12px;
            border-radius: 60px;
            margin: 15px 0 20px;
            color: #531e3a;
            font-weight: bold;
            box-shadow: inset 0 1px 4px #ffbfdf, 0 2px 5px rgba(0,0,0,0.05);
        }
        .modal-btn {
            background: #ff8fc7;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 40px;
            color: #2f1d3a;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 0 #b15583;
            transition: 0.05s linear;
            width: 80%;
        }
        .modal-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b15583;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 550px) {
            .game-container {
                padding: 15px 20px 25px;
            }
            .stats {
                padding: 8px 15px;
            }
            .score-box .value, .timer-box .value {
                font-size: 1.5rem;
            }
            .mole {
                font-size: 2.3rem;
            }
            .empty-hole {
                font-size: 1.5rem;
            }
            .grid {
                gap: 12px;
            }
            .modal-card {
                width: 260px;
                padding: 20px 16px 28px;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="game-container">
        <!-- 状态栏 -->
        <div class="stats">
            <div class="score-box">
                <span>🐕 得分</span>
                <div class="value">{{ score }}</div>
            </div>
            <div class="target-box">
                <span>🎯 目标</span>
                <div class="value">{{ targetScore }}</div>
            </div>
            <div class="timer-box">
                <span>⏱️ 剩余</span>
                <div class="value">{{ timeLeft }}</div>
            </div>
        </div>

        <!-- 打地鼠网格 3x3 小狗出没！速度加快版 + 打击特效 -->
        <div class="grid">
            <div v-for="(hole, idx) in holes" :key="idx" class="hole" @click="hitMole(idx, $event)">
                <div v-if="hole.active" class="mole">
                    🐕
                </div>
                <div v-else class="empty-hole">
                    🕳️
                </div>
            </div>
        </div>

        <button class="btn-restart" @click="resetGame">✨ 新的一局 ✨</button>
        <div class="message-area">
            💥 快打大大鲨狗头！ 达到 {{ targetScore }} 分胜利，否则失败...
        </div>
        <footer>🐶 </footer>
    </div>

    <!-- 自定义居中弹窗 (模态框) -->
    <div v-if="modalVisible" class="modal-overlay" @click.self="closeModal">
        <div class="modal-card">
            <div class="modal-icon">{{ modalIcon }}</div>
            <div class="modal-title">{{ modalTitle }}</div>
            <div class="modal-message">{{ modalMessage }}</div>
            <button class="modal-btn" @click="closeModal">继续挑战</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
<script>
    const { createApp, ref, onMounted, onUnmounted } = Vue;

    createApp({
        setup() {
            // ---------- 游戏配置 (更快版本: 频率提升 + 停留缩短 + 目标30分) ----------
            const INIT_TIME = 30;               // 30秒倒计时
            const TARGET_SCORE = 30;            // 目标30分胜利
            const MAX_ACTIVE_MOLES = 3;          // 最多同时出现3只小狗
            const GENERATE_INTERVAL_MS = 520;    // 每0.52秒尝试生成一只
            const MOLE_VISIBLE_TIME = 450;       // 每只小狗仅停留0.45秒

            // 响应式数据
            const gameActive = ref(true);
            const score = ref(0);
            const timeLeft = ref(INIT_TIME);
            const targetScore = ref(TARGET_SCORE);
            
            // 弹窗相关
            const modalVisible = ref(false);
            const modalIcon = ref('');
            const modalTitle = ref('');
            const modalMessage = ref('');
            
            // 3x3 洞的数据
            const holes = ref([]);
            
            // 定时器ID
            let generateInterval = null;
            let countdownInterval = null;
            let moleTimeouts = [];
            
            // 辅助: 初始化洞状态
            function initHoles() {
                const newHoles = [];
                for (let i = 0; i < 9; i++) {
                    newHoles.push({ active: false });
                }
                holes.value = newHoles;
            }
            
            // 清除所有洞的消失计时器
            function clearAllMoleTimeouts() {
                if (moleTimeouts.length) {
                    moleTimeouts.forEach(timeoutId => {
                        if (timeoutId) clearTimeout(timeoutId);
                    });
                    moleTimeouts = [];
                }
            }
            
            // 清除所有游戏主定时器
            function clearGameIntervals() {
                if (generateInterval) {
                    clearInterval(generateInterval);
                    generateInterval = null;
                }
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
            }
            
            // 重置某一个洞的消失计时器
            function clearMoleTimeoutForIndex(index) {
                if (moleTimeouts[index]) {
                    clearTimeout(moleTimeouts[index]);
                    moleTimeouts[index] = null;
                }
            }
            
            // 让指定洞的地鼠消失 (不清除分数)
            function deactivateMole(index, skipTimerClear = false) {
                if (!holes.value[index]) return;
                if (holes.value[index].active === true) {
                    holes.value[index].active = false;
                    if (!skipTimerClear) {
                        clearMoleTimeoutForIndex(index);
                    }
                }
            }
            
            // 生成一只新地鼠
            function tryGenerateMole() {
                if (!gameActive.value) return;
                
                const activeCount = holes.value.filter(hole => hole.active === true).length;
                if (activeCount >= MAX_ACTIVE_MOLES) return;
                
                const inactiveIndices = [];
                holes.value.forEach((hole, idx) => {
                    if (!hole.active) inactiveIndices.push(idx);
                });
                if (inactiveIndices.length === 0) return;
                
                const randomIndex = inactiveIndices[Math.floor(Math.random() * inactiveIndices.length)];
                holes.value[randomIndex].active = true;
                
                clearMoleTimeoutForIndex(randomIndex);
                
                const timeoutId = setTimeout(() => {
                    if (holes.value[randomIndex] && holes.value[randomIndex].active === true) {
                        holes.value[randomIndex].active = false;
                    }
                    if (moleTimeouts[randomIndex] === timeoutId) {
                        moleTimeouts[randomIndex] = null;
                    }
                }, MOLE_VISIBLE_TIME);
                
                moleTimeouts[randomIndex] = timeoutId;
            }
            
            // 开始生成地鼠
            function startGeneratingMoles() {
                if (generateInterval) clearInterval(generateInterval);
                generateInterval = setInterval(() => {
                    tryGenerateMole();
                }, GENERATE_INTERVAL_MS);
            }
            
            // 倒计时
            function startCountdown() {
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    if (!gameActive.value) return;
                    if (timeLeft.value > 0) {
                        timeLeft.value--;
                        if (timeLeft.value === 0) {
                            if (score.value >= targetScore.value) {
                                if (gameActive.value) endGame(true);
                            } else {
                                if (gameActive.value) endGame(false);
                            }
                        }
                    }
                }, 1000);
            }
            
            // 显示自定义弹窗 (替代alert)
            function showModal(isVictory) {
                if (isVictory) {
                    modalIcon.value = '🏆🐕';
                    modalTitle.value = '胜利！';
                    modalMessage.value = '🎉 汪汪胜利！大大鲨是狗！ 🎉';
                } else {
                    modalIcon.value = '💀🐺';
                    modalTitle.value = '游戏失败';
                    modalMessage.value = '大大鲨是狼';   // 失败时显示指定文案
                }
                modalVisible.value = true;
            }
            
            // 关闭弹窗
            function closeModal() {
                modalVisible.value = false;
            }
            
            // 结束游戏
            function endGame(isVictory) {
                if (!gameActive.value) return;
                gameActive.value = false;
                
                clearGameIntervals();
                clearAllMoleTimeouts();
                // 将所有地鼠变为非活跃
                for (let i = 0; i < holes.value.length; i++) {
                    if (holes.value[i].active) {
                        holes.value[i].active = false;
                    }
                }
                
                showModal(isVictory);
            }
            
            // ----- 打击特效核心函数 -----
            // 为被击中的小狗添加动画特效，并延迟后清除class (不影响状态消失)
            function playHitAnimation(event, holeIndex) {
                // 通过事件找到具体的 .mole 元素
                const targetEl = event.currentTarget; // 当前点击的 .hole 元素
                if (!targetEl) return;
                const moleDiv = targetEl.querySelector('.mole');
                if (moleDiv) {
                    // 移除之前的动画class (如果残留)
                    moleDiv.classList.remove('mole-hit');
                    // 强制重绘小技巧: 直接添加动画
                    void moleDiv.offsetWidth; // 强制同步样式
                    moleDiv.classList.add('mole-hit');
                    // 动画结束后移除class，但注意动画很短，不影响消失逻辑
                    setTimeout(() => {
                        if (moleDiv) moleDiv.classList.remove('mole-hit');
                    }, 200);
                }
            }
            
            // 点击打地鼠 (带交互特效)
            function hitMole(index, event) {
                if (!gameActive.value) return;
                const hole = holes.value[index];
                if (hole && hole.active) {
                    // 1. 播放打击特效 (视觉反馈)
                    playHitAnimation(event, index);
                    
                    // 2. 增加分数
                    score.value++;
                    
                    // 3. 让小狗消失 (注意：消失操作不能过于提前导致动画中断，但动画很快，同时调用没问题)
                    // 为了更平滑，让消失稍微延迟一帧？但用户期待立即加分且小狗消失，特效已经触发。
                    // 但直接deactivateMole会让小狗从DOM消失，动画就看不见了。需要延迟一点点执行消失，让动画播放完再消失。
                    // 但为了避免玩家连续点击同一个洞，我们可以延迟80ms消失，同时禁止短时间内再次点击同一只狗（设置一个锁定标志）
                    // 更优雅：先临时禁用该洞的再次点击标记，并延迟消失。但为了特效完整，让消失延迟执行，并且保留加分已经完成。
                    // 且要防止消失期间再次点击同一个洞，我们可以在延迟期间忽略再次命中。
                    // 由于我们已设置游戏active判定，并且分数增加一次后，该洞active还是true，如果不立即消失，玩家会重复点击同一只狗刷分！
                    // 所以必须立刻让该洞的active变为false，但同时为了特效，我们可以保持视觉上动画但数据已消失，这样玩家无法再次得分。
                    // 但视觉上如果数据消失了，.mole会立刻变成.empty-hole，动画看不到了。解决方案：不立刻改变active，而是克隆/覆盖？
                    // 更靠谱方案：给该洞增加一个“正在击中”临时状态，延迟0.15秒再正式改变active。但这样可能导致连续点击得分bug。
                    // 为了保证公平，还是先立即设置为false避免重复得分，同时因为动画很短，可以隐藏真实小狗，但视觉上保留特效元素？这比较复杂。
                    // 换一种方式：利用CSS动画在元素消失前完成，我们立即设置active=false导致v-if移除，但动画也会移除。因此我们不要让active立即变false。
                    // 因此采用延迟方案：先让小狗的DOM加动画，同时临时禁用该洞的点击（用标记），延迟一小段时间（0.12s）后再设置active=false。这样可以保证动画完整，且不会重复得分。
                    // 设定一个lock标志防止重复点击同一洞。
                    
                    // 使用Map来记录临时锁定
                    if (!window._hitLock) window._hitLock = new Set();
                    if (window._hitLock.has(index)) return; // 已击中待消失
                    window._hitLock.add(index);
                    
                    // 增加分数 (已加)
                    // 延迟消失，让动画展示完整
                    setTimeout(() => {
                        if (holes.value[index] && holes.value[index].active === true) {
                            deactivateMole(index, false);
                        }
                        window._hitLock.delete(index);
                    }, 130); // 略长于动画时间，保证看到打击特效
                    
                    // 胜利判断 (分数已增加)
                    if (score.value >= targetScore.value) {
                        if (gameActive.value) {
                            // 注意: 游戏结束前要把所有锁定清理，然后结束
                            if (window._hitLock) window._hitLock.clear();
                            endGame(true);
                        }
                    }
                }
            }
            
            // 重置游戏 (全新一局)
            function resetGame() {
                // 清空所有临时锁
                if (window._hitLock) window._hitLock.clear();
                // 关闭弹窗
                if (modalVisible.value) {
                    modalVisible.value = false;
                }
                
                if (gameActive.value === true) {
                    clearGameIntervals();
                    clearAllMoleTimeouts();
                } else {
                    clearGameIntervals();
                    clearAllMoleTimeouts();
                }
                
                gameActive.value = true;
                score.value = 0;
                timeLeft.value = INIT_TIME;
                
                // 重置所有洞
                for (let i = 0; i < holes.value.length; i++) {
                    if (holes.value[i].active) {
                        holes.value[i].active = false;
                    }
                    clearMoleTimeoutForIndex(i);
                }
                
                initHoles();
                startCountdown();
                startGeneratingMoles();
                
                // 开局快速出现2~3只小狗
                setTimeout(() => {
                    if (gameActive.value) {
                        tryGenerateMole();
                        setTimeout(() => {
                            if (gameActive.value) tryGenerateMole();
                            setTimeout(() => {
                                if (gameActive.value && holes.value.filter(h => h.active).length < MAX_ACTIVE_MOLES) {
                                    tryGenerateMole();
                                }
                            }, 120);
                        }, 100);
                    }
                }, 40);
            }
            
            // 初始化游戏入口
            function initGame() {
                initHoles();
                gameActive.value = true;
                score.value = 0;
                timeLeft.value = INIT_TIME;
                startCountdown();
                startGeneratingMoles();
                setTimeout(() => {
                    if (gameActive.value) {
                        tryGenerateMole();
                        setTimeout(() => {
                            if (gameActive.value) tryGenerateMole();
                            setTimeout(() => {
                                if (gameActive.value) tryGenerateMole();
                            }, 150);
                        }, 80);
                    }
                }, 50);
            }
            
            onMounted(() => {
                initGame();
            });
            
            onUnmounted(() => {
                clearGameIntervals();
                clearAllMoleTimeouts();
                if (window._hitLock) window._hitLock.clear();
            });
            
            return {
                holes,
                score,
                timeLeft,
                targetScore,
                hitMole,
                resetGame,
                modalVisible,
                modalIcon,
                modalTitle,
                modalMessage,
                closeModal,
            };
        }
    }).mount('#app');
</script>
</body>
</html>
