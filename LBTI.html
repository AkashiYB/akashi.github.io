<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>逆水寒 · 副本玩家身份鉴定</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(10, 25, 47, 0.9), rgba(2, 12, 27, 0.95));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.2rem;
            position: relative;
            overflow-x: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .test-container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: floatIn 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .test-container:hover {
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 245, 200, 0.3);
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero {
            background: linear-gradient(135deg, #1f3b4c, #0e2a38);
            padding: 2rem 2rem 1.6rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,130,0.2) 0%, rgba(255,255,255,0) 70%);
            animation: shimmer 12s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-30%) translateY(-30%) rotate(5deg); opacity: 0.3; }
            50% { transform: translateX(10%) translateY(10%) rotate(0deg); opacity: 0.7; }
            100% { transform: translateX(-30%) translateY(-30%) rotate(5deg); opacity: 0.3; }
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero h1 span {
            background: #f5c542;
            padding: 0 14px;
            border-radius: 60px;
            color: #1f2e46;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .hero p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.6rem;
        }

        .progress-area {
            padding: 1.2rem 2rem 0.8rem;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(100,120,140,0.2);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1f3b4c;
            margin-bottom: 10px;
        }

        .question-counter, .answered-badge {
            background: rgba(44,90,122,0.15);
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        .progress-bar-bg {
            background: rgba(0,0,0,0.1);
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3f8db3, #f5c542);
            width: 0%;
            height: 100%;
            border-radius: 40px;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 0 6px #f5c542;
        }

        .question-card {
            padding: 2rem 2rem 1.8rem;
            background: rgba(255, 255, 255, 0.85);
            transition: all 0.3s;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.35;
            color: #0a1c2c;
            margin-bottom: 2rem;
            animation: textGlide 0.4s ease-out;
        }

        @keyframes textGlide {
            from {
                opacity: 0;
                transform: translateX(18px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0 1.8rem;
        }

        .option-card {
            background: rgba(250, 252, 255, 0.9);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(90, 130, 160, 0.3);
            border-radius: 1.5rem;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            color: #1a3a4e;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }

        .option-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(245, 197, 66, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
            pointer-events: none;
        }

        .option-card:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
            transition: 0s;
        }

        .option-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #f5c542;
            background: white;
            box-shadow: 0 18px 28px -12px rgba(0,0,0,0.2);
        }

        .option-card.active {
            background: linear-gradient(135deg, #2c5a7a, #1f4662);
            border-color: #f5c542;
            color: white;
            box-shadow: 0 12px 24px -8px rgba(44,90,122,0.5);
            transform: scale(0.98);
        }

        .option-label {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-btn, .action-btn {
            background: rgba(220, 235, 245, 0.8);
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #1f3b4c;
            backdrop-filter: blur(4px);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.primary, .action-btn.primary {
            background: linear-gradient(95deg, #2c5a7a, #3b6e8e);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-btn.primary:hover, .action-btn.primary:hover {
            background: #1f4662;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -6px rgba(0,0,0,0.3);
        }

        .nav-btn:hover:not(.primary), .reset-btn:hover {
            background: rgba(200, 215, 230, 0.9);
            transform: translateY(-2px);
        }

        .reset-btn {
            background: rgba(230, 240, 250, 0.9);
            border: 1px solid #b7cfdf;
        }

        .warning-tip {
            color: #d97a3c;
            font-size: 0.75rem;
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
        }

        .result-area {
            background: rgba(255, 255, 245, 0.96);
            padding: 1.8rem 2rem 2rem;
            animation: resultPop 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-card {
            background: linear-gradient(125deg, #fff9ef, #ffffff);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,200,0.8);
            border: 1px solid rgba(245,197,66,0.3);
        }

        .type-badge {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(145deg, #1f3b4c, #0f2a38);
            display: inline-block;
            padding: 0.4rem 1.8rem;
            border-radius: 80px;
            color: #f5c542;
            margin-bottom: 1rem;
            box-shadow: 0 8px 0 #0a1e28;
            animation: badgeGlow 1.2s infinite alternate;
        }

        @keyframes badgeGlow {
            0% { text-shadow: 0 0 0px #f5c542; box-shadow: 0 8px 0 #0a1e28; }
            100% { text-shadow: 0 0 8px #ffdf8c; box-shadow: 0 8px 0 #0a1e28, 0 0 12px rgba(245,197,66,0.5); }
        }

        .type-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0.8rem 0 0.5rem;
            background: linear-gradient(135deg, #2c5a7a, #a5792b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .type-desc {
            font-size: 1rem;
            line-height: 1.5;
            color: #2c4e6b;
            padding: 0 0.5rem;
        }

        .retake-btn {
            background: #e1eaf1;
            border: none;
            margin-top: 1.8rem;
            padding: 0.8rem 2rem;
            border-radius: 3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .retake-btn:hover {
            background: #cbdde9;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1rem;
            color: #5c7f9a;
            background: rgba(248,250,252,0.9);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        @media (max-width: 650px) {
            body { padding: 1rem; }
            .question-text { font-size: 1.2rem; }
            .options-grid { grid-template-columns: 1fr; gap: 0.7rem; }
            .nav-buttons { flex-direction: column; align-items: stretch; }
            .type-badge { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="test-container" id="app">
    <div class="hero">
        <h1>⚔️ 牢本玩家 <span>LBTI</span></h1>
        <p>逆水寒 · 副本真实身份测试 | 你的副本人格究竟是什么？</p>
    </div>

    <div class="progress-area">
        <div class="stats">
            <span class="question-counter" id="questionCounter">第1 / 28题</span>
            <span class="answered-badge" id="answeredCount">✓ 已答 0 / 28</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="question-card" id="questionCard">
        <div class="question-text" id="questionText">加载中...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn">◀ 上一题</button>
            <button class="action-btn reset-btn" id="resetBtn">⟳ 重置测试</button>
            <button class="action-btn primary" id="forceResultBtn">✨ 查看结果</button>
        </div>
        <div class="warning-tip" id="warningMsg"></div>
    </div>

    <div class="result-area hidden" id="resultArea">
        <div class="result-card">
            <div class="type-badge" id="mbtiType">🏷️</div>
            <div class="type-name" id="typeTitle">副本旅人</div>
            <div class="type-desc" id="typeDescription">完成全部题目，解锁你的专属副本身份卡。</div>
            <button class="retake-btn" id="retakeBtn">🔄 重新测试</button>
        </div>
    </div>
    <footer>基于真实副本生态 · 每题反映你的团队风格</footer>
</div>

    const TOTAL_QS = questionsData.length;
    let scores = new Array(TOTAL_QS).fill(null);      // 存储每道题选择的选项索引(0-3)
    let currentIndex = 0;

    // DOM 元素
    const questionTextEl = document.getElementById("questionText");
    const optionsGrid = document.getElementById("optionsGrid");
    const prevBtn = document.getElementById("prevBtn");
    const resetBtn = document.getElementById("resetBtn");
    const forceResultBtn = document.getElementById("forceResultBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const resultArea = document.getElementById("resultArea");
    const warningMsg = document.getElementById("warningMsg");
    const questionCounterSpan = document.getElementById("questionCounter");
    const answeredCountSpan = document.getElementById("answeredCount");
    const progressFill = document.getElementById("progressFill");
    const typeBadgeSpan = document.getElementById("mbtiType");
    const typeTitleSpan = document.getElementById("typeTitle");
    const typeDescSpan = document.getElementById("typeDescription");

    // 粒子特效背景（沿用）
    function initParticles() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth, height = window.innerHeight;
        let particles = [];
        const PARTICLE_COUNT = 90;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 3 + 1,
                alpha: Math.random() * 0.5 + 0.2,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: (Math.random() - 0.5) * 0.2,
                color: `hsl(${Math.random() * 40 + 30}, 70%, 65%)`
            });
        }
        function draw() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#f5c542";
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;
                if (p.y < -10) p.y = height + 10;
                if (p.y > height + 10) p.y = -10;
            }
            requestAnimationFrame(draw);
        }
        draw();
    }
    initParticles();

    function updateStats() {
        const answeredTotal = scores.filter(s => s !== null).length;
        answeredCountSpan.innerText = `✓ 已答 ${answeredTotal} / ${TOTAL_QS}`;
        const percent = (answeredTotal / TOTAL_QS) * 100;
        progressFill.style.width = `${percent}%`;
        questionCounterSpan.innerText = `第${currentIndex+1} / ${TOTAL_QS}题`;
        warningMsg.innerText = "";
    }

    function highlightCurrentOption() {
        const selectedIdx = scores[currentIndex];
        const btns = document.querySelectorAll(".option-card");
        btns.forEach((btn, idx) => {
            if (idx === selectedIdx) btn.classList.add("active");
            else btn.classList.remove("active");
        });
    }

    function autoNavigate() {
        if (scores[currentIndex] !== null) {
            if (currentIndex < TOTAL_QS - 1) {
                const card = document.querySelector(".question-card");
                card.style.animation = "none";
                card.offsetHeight;
                card.style.animation = "floatIn 0.3s ease";
                currentIndex++;
                renderCurrentQuestion();
            } else {
                if (scores.every(s => s !== null)) showResult();
                else showResult();
            }
        } else {
            warningMsg.innerText = "✨ 请选择一个选项，自动进入下一题 ✨";
            setTimeout(() => { if(warningMsg.innerText.includes("自动进入")) warningMsg.innerText = ""; }, 1500);
        }
    }

    function onOptionClick(optionIndex) {
        scores[currentIndex] = optionIndex;
        updateStats();
        renderCurrentQuestion(); // 刷新高亮
        autoNavigate();
    }

    function renderCurrentQuestion() {
        const q = questionsData[currentIndex];
        if (!q) return;
        questionTextEl.style.animation = "none";
        questionTextEl.offsetHeight;
        questionTextEl.style.animation = "textGlide 0.35s ease-out";
        questionTextEl.innerText = q.text;

        let optionsHtml = "";
        q.options.forEach((opt, idx) => {
            optionsHtml += `<div class="option-card" data-idx="${idx}"><div class="option-label">${opt.label}</div></div>`;
        });
        optionsGrid.innerHTML = optionsHtml;
        const optionDivs = document.querySelectorAll(".option-card");
        optionDivs.forEach(div => {
            div.addEventListener("click", (e) => {
                e.stopPropagation();
                const idx = parseInt(div.getAttribute("data-idx"));
                onOptionClick(idx);
            });
        });
        highlightCurrentOption();
        updateStats();
    }

    // 计算四种特质总分，并映射结果
    function computePlayerType() {
        let totals = { lead: 0, dmg: 0, team: 0, chill: 0 };
        for (let i = 0; i < TOTAL_QS; i++) {
            const selected = scores[i];
            if (selected === null) continue;
            const points = questionsData[i].options[selected].points;
            totals.lead += points.lead || 0;
            totals.dmg += points.dmg || 0;
            totals.team += points.team || 0;
            totals.chill += points.chill || 0;
        }
        // 找出最高和次高特质
        const traits = [
            { name: "lead", label: "指挥", score: totals.lead },
            { name: "dmg", label: "输出", score: totals.dmg },
            { name: "team", label: "团队", score: totals.team },
            { name: "chill", label: "佛系", score: totals.chill }
        ];
        traits.sort((a,b) => b.score - a.score);
        const primary = traits[0];
        const secondary = traits[1];
        // 组合映射出16种结果
        const typeMap = {
            "lead_lead": { name: "铁血指挥使", desc: "天生的团长，思路清晰，控场一流，队友跟着你就有安全感。", badge: "🎙️" },
            "lead_dmg": { name: "战术后仰型", desc: "既懂指挥又能打出爆炸输出，团队大腿，偶尔压力队友但能过本。", badge: "⚔️" },
            "lead_team": { name: "灵魂导师", desc: "温柔指挥，照顾每一个队友情绪，凝聚力极强，开荒必备。", badge: "🛡️" },
            "lead_chill": { name: "佛系领路人", desc: "指挥但不强求，佛系过本，能带就带，心态极好。", badge: "🍃" },
            "dmg_lead": { name: "狂暴输出者", desc: "秒伤永远第一，偶尔客串指挥，输出就是最好的防守。", badge: "🔥" },
            "dmg_dmg": { name: "修罗战神", desc: "眼里只有输出循环，走位风骚，DPS统计的王者。", badge: "💥" },
            "dmg_team": { name: "团队大炮台", desc: "输出稳定且愿意配合团队，人狠话不多。", badge: "🎯" },
            "dmg_chill": { name: "快乐散人", desc: "能打但不上头，打完就溜，副本是副业。", badge: "😎" },
            "team_lead": { name: "和事佬指挥", desc: "擅长调解矛盾，团队粘合剂，大家爱跟你的团。", badge: "🤝" },
            "team_dmg": { name: "六边形战士", desc: "又能辅助又能输出，哪里需要去哪里，万金油选手。", badge: "🌟" },
            "team_team": { name: "暖心辅助长", desc: "永远在给队友套盾、喊技能，团队的最强后盾。", badge: "💚" },
            "team_chill": { name: "佛系辅助", desc: "随缘奶随缘增益，但关键时候从不掉链子。", badge: "🌸" },
            "chill_lead": { name: "摸鱼指挥官", desc: "偶尔开麦指点江山，大部分时间安静划水，但指挥有效。", badge: "🐟" },
            "chill_dmg": { name: "随缘输出", desc: "秒伤时高时低，看心情打本，队友习惯了就好。", badge: "🍵" },
            "chill_team": { name: "挂件小可爱", desc: "负责活跃气氛，副本吉祥物，有你在团队更欢乐。", badge: "🎈" },
            "chill_chill": { name: "究极佛系", desc: "副本随缘，生死看淡，上线就是养老，牢本不存在。", badge: "☁️" }
        };
        let key = `${primary.name}_${secondary.name}`;
        let result = typeMap[key];
        if (!result) result = { name: "开荒混沌体", desc: "你的风格难以定义，可能是万中无一的副本奇才。", badge: "🌀" };
        return result;
    }

    function showResult() {
        const allAnswered = scores.every(s => s !== null);
        if (!allAnswered) {
            warningMsg.innerText = "⚠️ 请完成全部28道题，才能解锁你的副本身份！";
            return false;
        }
        const typeInfo = computePlayerType();
        typeBadgeSpan.innerText = typeInfo.badge;
        typeTitleSpan.innerText = typeInfo.name;
        typeDescSpan.innerText = typeInfo.desc;
        document.querySelector(".question-card").classList.add("hidden");
        resultArea.classList.remove("hidden");
        warningMsg.innerText = "";
        return true;
    }

    function resetTest() {
        scores = new Array(TOTAL_QS).fill(null);
        currentIndex = 0;
        document.querySelector(".question-card").classList.remove("hidden");
        resultArea.classList.add("hidden");
        renderCurrentQuestion();
        updateStats();
        warningMsg.innerText = "";
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        } else {
            warningMsg.innerText = "🌟 已是第一题，继续选择吧";
            setTimeout(() => { if(warningMsg.innerText.includes("第一题")) warningMsg.innerText = ""; }, 1200);
        }
    }

    function handleForceResult() {
        const allDone = scores.every(s => s !== null);
        if (!allDone) warningMsg.innerText = "📌 请先完成所有28个问题，再查看你的副本身份。";
        else showResult();
    }

    prevBtn.addEventListener("click", prevQuestion);
    resetBtn.addEventListener("click", resetTest);
    forceResultBtn.addEventListener("click", handleForceResult);
    retakeBtn.addEventListener("click", resetTest);
    renderCurrentQuestion();
