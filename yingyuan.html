<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最好的小林</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
            color: #fff;
            min-height: 100vh;
			overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1523476040328-8d4bd6e4c0f0?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            padding: 30px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1.5s ease-out;
        }
        
        .header h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
        }
        
        .header p {
            font-size: 1.8rem;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* 3D翻转卡片效果 */
        .flip-container {
            width: 100%;
            max-width: 800px;
            height: 350px;
            margin: 40px auto;
            perspective: 1200px;
        }
        
        .flipper {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: flip 8s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        
        .flipper:hover {
            animation-play-state: paused;
        }
        
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            text-align: center;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        
        .flip-front {
            background: linear-gradient(rgba(255, 154, 158, 0.8), rgba(250, 208, 196, 0.8)), 
                        url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            transform: rotateX(0deg);
        }
        
        .flip-back {
            background: linear-gradient(rgba(166, 193, 238, 0.8), rgba(251, 194, 235, 0.8)), 
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            transform: rotateX(180deg);
        }
        
        .message {
            font-size: 4.5rem;
            font-weight: bold;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            line-height: 1.3;
            color: #fff;
            padding: 20px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        /* 心形图标部分 */
        .heart-section {
            margin: 60px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: pulse 3s infinite alternate;
        }
        
        .heart-icon {
            color: #ff3366;
            font-size: 6rem;
            margin: 20px;
            animation: heartbeat 1.2s infinite;
            text-shadow: 0 0 30px rgba(255, 51, 102, 0.9);
        }
        
        .heart-text {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* 烟花容器 */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: float linear infinite;
        }
        
        /* 页脚 */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 1.5rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            z-index: 10;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            backdrop-filter: blur(5px);
            max-width: 90%;
        }
        
        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes flip {
            0% { transform: rotateX(0deg); }
            25% { transform: rotateX(180deg); }
            50% { transform: rotateX(180deg); }
            75% { transform: rotateX(360deg); }
            100% { transform: rotateX(360deg); }
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes float {
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
            100% { box-shadow: 0 10px 50px rgba(255, 51, 102, 0.5); }
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .message { font-size: 3.5rem; }
            .header h1 { font-size: 3rem; }
            .flip-container { height: 300px; }
            .heart-text { font-size: 2rem; }
        }
        
        @media (max-width: 600px) {
            .message { font-size: 2.5rem; }
            .header h1 { font-size: 2.5rem; }
            .header p { font-size: 1.4rem; }
            .flip-container { height: 250px; }
            .heart-icon { font-size: 4.5rem; }
            .heart-text { font-size: 1.8rem; }
            .footer { font-size: 1.2rem; padding: 15px 30px; }
        }
        
        @media (max-width: 400px) {
            .message { font-size: 2rem; }
            .header h1 { font-size: 2rem; }
            .flip-container { height: 200px; }
            .heart-section { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>宅急送の小林</h1>
            <p>我对小林妈妈最深的爱与感激</p>
        </div>
        
        <div class="flip-container">
            <div class="flipper">
                <div class="flip-front">
                    <div class="message">小林是天下最好的妈妈！</div>
                </div>
                <div class="flip-back">
                    <div class="message">我永远爱您！</div>
                </div>
            </div>
        </div>
        
        <div class="heart-section">
            <i class="fas fa-heart heart-icon"></i>
            <div class="heart-text">❤️ 妈妈您辛苦了 ❤️</div>
        </div>
        
        <div class="footer">
            <p>您无私的爱与奉献是我最大的幸福源泉</p>
        </div>
        
        <!-- 烟花容器 -->
        <div class="fireworks-container" id="fireworks"></div>
        
        <!-- 粒子容器 -->
        <div class="particles" id="particles"></div>
    </div>

    <script>
        // 创建粒子背景
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 150;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机属性
                const size = Math.random() * 8 + 2;
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 5;
                const colors = ['#ff9a9e', '#fad0c4', '#fbc2eb', '#a6c1ee', '#ffcc00'];
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(particle);
            }
        }
        
        // 创建烟花效果
        function createFirework() {
            const container = document.getElementById('fireworks');
            
            // 随机位置
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.6;
            
            // 创建烟花
            const firework = document.createElement('div');
            firework.style.position = 'absolute';
            firework.style.left = '50%';
            firework.style.top = '100%';
            firework.style.width = '6px';
            firework.style.height = '6px';
            firework.style.borderRadius = '50%';
            firework.style.background = '#fff';
            firework.style.boxShadow = '0 0 10px #fff, 0 0 20px #ff9a9e';
            
            container.appendChild(firework);
            
            // 烟花上升动画
            const riseAnimation = firework.animate([
                { transform: 'translate(0, 0)', opacity: 1 },
                { transform: `translate(${x - window.innerWidth/2}px, ${y - window.innerHeight}px)`, opacity: 1 }
            ], {
                duration: 1000,
                easing: 'ease-out'
            });
            
            // 烟花爆炸效果
            riseAnimation.onfinish = () => {
                firework.remove();
                createExplosion(x, y);
            };
        }
        
        // 创建爆炸效果
        function createExplosion(x, y) {
            const container = document.getElementById('fireworks');
            const colors = ['#ff3366', '#ff9933', '#ffcc00', '#66ccff', '#9966ff', '#ff6699'];
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.width = '5px';
                particle.style.height = '5px';
                particle.style.borderRadius = '50%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = '0 0 10px currentColor';
                
                container.appendChild(particle);
                
                // 随机角度和距离
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                const duration = Math.random() * 1500 + 1000;
                
                // 粒子爆炸动画
                const explosionAnimation = particle.animate([
                    { transform: 'translate(0, 0)', opacity: 1, width: '5px', height: '5px' },
                    { 
                        transform: `translate(${tx}px, ${ty}px)`, 
                        opacity: 0,
                        width: '2px',
                        height: '2px'
                    }
                ], {
                    duration: duration,
                    easing: 'ease-out'
                });
                
                // 动画结束后移除粒子
                explosionAnimation.onfinish = () => {
                    particle.remove();
                };
            }
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            // 创建粒子背景
            createParticles();
            
            // 创建初始烟花
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFirework(), i * 400);
            }
            
            // 定时创建烟花
            setInterval(() => {
                if (Math.random() > 0.2) {
                    createFirework();
                }
            }, 1800);
            
            // 点击页面创建烟花
            document.addEventListener('click', (e) => {
                createExplosion(e.clientX, e.clientY);
            });
        });
    </script>
</body>
</html>
